# src/main/resources/baltic-frozen.yaml
simulation:
  maxTicks: 336   # 2 weeks, large volume

company:
  name: "Baltic Frozen Supplies Ltd"
  description: "High-volume frozen herring & sprat"

seaRegions:
  - name: "Baltic Sea"
    seasonMultiplier: 0.7
    fishTypes: ["Herring", "Sprat", "Cod", "Perch", "Salmon"]

parties:
  - type: Fisher
    id: fisher-baltic1
    name: "Baltic Trawler 1"
    balance: "300000 CZK"
    fishingZones:
      - "Baltic Sea"

  - type: Fisher
    id: fisher-baltic2
    name: "Baltic Trawler 2"
    balance: "280000 CZK"
    fishingZones:
      - "Baltic Sea"

  - type: Processor
    id: proc-riga
    name: "Riga Frozen Processing"
    balance: "1800000 CZK"

  - type: Warehouse
    id: wh-riga-frozen
    name: "Riga Deep Freeze"
    balance: "1000000 CZK"

  - type: Distributor
    id: dist-central-eu
    name: "Central EU Frozen Logistics"
    balance: "3000000 CZK"

  - type: Customer
    id: supermkt-chain
    name: "EuroMart Chain"
    balance: "5000000 CZK"

  - type: Customer
    id: cust-retail
    name: "Retail Customer"
    balance: "10000 CZK"

  - type: Cook
    id: cook-frozen
    name: "Industrial Cook Janis"

  - type: RepairTechnician
    id: tech-baltic1
    name: "Tech Andris"

  # second technician — for high load handling and stress testing
  - type: RepairTechnician
    id: tech-baltic2
    name: "Tech Juris"

  - type: SCMManager
    id: scm-baltic
    name: "SCM Baltic Director"

  - type: Inspector
    id: inspector-baltic
    name: "Inspector Olga"

devices:
  - type: IndustrialFreezer
    id: blast-01
    energyPerHour: 12.0
    maintenanceCost: "8000 CZK"

  - type: PackagingMachine
    id: pack-frozen
    energyPerHour: 7.0
    maintenanceCost: "5000 CZK"
    # Optional: speed: 100 (packages per minute)

productionLines:
  - name: "Frozen Blocks Line"
    ownerId: "proc-riga"
    devices: ["blast-01", "pack-frozen"]
    cooks: ["cook-frozen"]
    technicians: ["tech-baltic1", "tech-baltic2"]

  - name: "Frozen Fillets Line"
    ownerId: "proc-riga"
    devices: ["blast-01"]
    cooks: []
    technicians: ["tech-baltic1"]