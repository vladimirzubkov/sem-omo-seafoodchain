# src/main/resources/russian-sea-dominator.yaml
simulation:
  maxTicks: 720

company:
  name: "Russian Sea Dominator JSC"
  description: "Largest seafood empire from Murmansk to Prague. Total domination."

seaRegions:
  - name: "Barents Sea"
    seasonMultiplier: 1.9
    fishTypes: ["Cod", "Haddock", "Salmon", "Herring", "King Crab"]

  - name: "White Sea"
    seasonMultiplier: 1.6
    fishTypes: ["Herring", "Navaga", "Flounder", "Salmon"]

  - name: "Kara Sea"
    seasonMultiplier: 2.2
    fishTypes: ["Polar Cod", "Arctic Char", "King Crab"]

parties:
  # --- RUSSIA (RUB) ---
  - type: Fisher
    id: fisher-murmansk1
    name: "Trawler Sever-1"
    balance: "180000000 RUB"
    fishingZones:
      - "Barents Sea"

  - type: Fisher
    id: fisher-murmansk2
    name: "Trawler Sever-2"
    balance: "175000000 RUB"
    fishingZones:
      - "Barents Sea"

  - type: Fisher
    id: fisher-kara
    name: "Ice-Class Fisher Kara Dominator"
    balance: "280000000 RUB"
    fishingZones:
      - "Kara Sea"

  - type: Processor
    id: proc-murmansk
    name: "Murmansk Mega Fish Plant"
    balance: "1200000000 RUB"

  - type: Warehouse
    id: wh-murmansk-giant
    name: "Arctic Deep Freeze Complex"
    balance: "800000000 RUB"

  - type: Distributor
    id: dist-russia-eu
    name: "TransSiberian Fish Logistics"
    balance: "2500000000 RUB"

  - type: Kitchen
    id: rest-moscow
    name: "Red Square Sushi & Caviar"
    balance: "600000000 RUB"
    acceptsDineIn: true
    supportsDelivery: true
    suppliesSupermarkets: false

  - type: Customer
    id: cust-oligarch
    name: "Oligarch Ivan Petrovich"
    balance: "100000000 RUB"

  # --- CZECHIA (CZK) ---
  - type: Warehouse
    id: wh-prague-hub
    name: "Prague Transit Hub"
    balance: "150000000 CZK"

  - type: Kitchen
    id: rest-prague
    name: "Prague Russian Seafood Palace"
    balance: "20000000 CZK"
    acceptsDineIn: true
    supportsDelivery: false
    suppliesSupermarkets: true

  # --- STAFF ---
  - type: Cook
    id: cook-vladimir
    name: "Master Chef Vladimir"

  - type: Cook
    id: cook-sergei
    name: "Sous Chef Sergei"

  - type: RepairTechnician
    id: tech-murmansk1
    name: "Technician Alexei"

  - type: RepairTechnician
    id: tech-murmansk2
    name: "Technician Dmitri"

  - type: RepairTechnician
    id: tech-prague
    name: "Technician Yuri"

  - type: RepairTechnician
    id: tech-moscow
    name: "Technician Anatoly"

  - type: SCMManager
    id: scm-director
    name: "Supply Chain Director Mikhail"

  - type: Inspector
    id: inspector-fsb
    name: "Federal Inspector Natalia"

devices:
  # --- MURMANSK DEVICES ---
  - type: IndustrialFreezer
    id: freezer-arctic1
    energyPerHour: 25.0
    maintenanceCost: "1200000 RUB"

  - type: FoodProcessingRobot
    id: fillet-line1
    energyPerHour: 18.0
    maintenanceCost: "1800000 RUB"
    capabilities:
      - "FILLETING"

  - type: PackagingMachine
    id: pack-robot1
    energyPerHour: 12.0
    maintenanceCost: "1500000 RUB"
    speed: 500

  # --- MOSCOW DEVICES ---
  - type: FoodProcessingRobot
    id: sushi-robot-moscow
    energyPerHour: 6.5
    maintenanceCost: "3000000 RUB"
    capabilities:
      - "COOKING"
      - "MIXING"
      - "CHOPPING"

  # --- PRAGUE DEVICES ---
  - type: Refrigerator
    id: ref-prague
    energyPerHour: 15.0
    maintenanceCost: "2500 CZK"

  - type: FoodProcessingRobot
    id: oven-prague
    energyPerHour: 5.0
    maintenanceCost: "8000 CZK"
    capabilities:
      - "COOKING"

productionLines:
  - name: "Mass Frozen Cod Production"
    ownerId: "proc-murmansk"
    devices: ["fillet-line1", "freezer-arctic1", "pack-robot1"]
    cooks: []
    technicians: ["tech-murmansk1", "tech-murmansk2"]

  - name: "King Crab & Luxury Export Line"
    ownerId: "proc-murmansk"
    devices: ["freezer-arctic1", "pack-robot1"]
    cooks: []
    technicians: ["tech-murmansk1"]

  - name: "Moscow Sushi Production"
    ownerId: "rest-moscow"
    devices: ["sushi-robot-moscow"]
    cooks: ["cook-vladimir"]
    technicians: ["tech-moscow"]

  - name: "Prague Fresh Line"
    ownerId: "rest-prague"
    devices: ["oven-prague", "ref-prague"]
    cooks: ["cook-sergei"]
    technicians: ["tech-prague"]