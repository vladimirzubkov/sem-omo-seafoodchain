  - type: PrecisionRobot
    id: prec-robot
    energyPerHour: 5.5
    maintenanceCost: "20000 CZK"

productionLines:
  - name: "Nigiri & Sashimi Line"
    devices: ["prec-robot", "super-freeze"]
    cooks: ["master-chef"]
    technicians: ["tech-prague"]

  - name: "Maki Roll Line"
    devices: ["prec-robot"]
    cooks: ["master-chef"]
    technicians: ["tech-prague"]