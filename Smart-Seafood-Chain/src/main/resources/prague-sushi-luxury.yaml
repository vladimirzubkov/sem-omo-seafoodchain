  - type: Kitchen
    id: kitchen-downtown
    name: "Downtown Sushi Kitchen"
    balance: "600000 CZK"

  - type: Kitchen
    id: kitchen-downtown
    name: "Downtown Sushi Kitchen"
    balance: "600000 CZK"
    acceptsDineIn: true
    supportsDelivery: true
    suppliesSupermarkets: false

  - type: Kitchen
    id: rest-vip1
    name: "Sushi Imperial Prague"
    balance: "1200000 CZK"
    acceptsDineIn: false
    supportsDelivery: true
    suppliesSupermarkets: true

  - type: Kitchen
    id: rest-vip2
    name: "Sushi River Prague"
    balance: "1000000 CZK"
    acceptsDineIn: true
    supportsDelivery: false
    suppliesSupermarkets: false

  - type: Customer
    id: cust-lux1
    name: "Luxury Client Petr"
    balance: "100000 CZK"

  - type: Cook
    id: master-chef
