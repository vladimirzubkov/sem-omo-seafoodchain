<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Seafood Chain - SW2 Dokumentace</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Icons
        const FileText = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>;
        const Boxes = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>;
        const GitBranch = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle></svg>;
        const Settings = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"></circle><path d="M12 1v6m0 6v6"></path></svg>;

        const RequirementCard = ({ id, title, priority, description }) => (
            <div className="border border-gray-200 rounded-lg p-4 hover:shadow-md transition-shadow">
                <div className="flex items-start justify-between mb-2">
                    <div className="flex items-center gap-2">
                        <span className="text-sm font-mono text-gray-500">{id}</span>
                        <h3 className="font-semibold text-gray-800">{title}</h3>
                    </div>
                    <span className={`text-xs px-2 py-1 rounded ${priority === 'Povinný' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}`}>
                        {priority}
                    </span>
                </div>
                <p className="text-sm text-gray-600">{description}</p>
            </div>
        );

        const EntityCard = ({ title, subtitle, attributes, methods }) => (
            <div className="border border-gray-200 rounded-lg p-4 hover:shadow-md transition-shadow">
                <h3 className="font-bold text-gray-800 mb-1">{title}</h3>
                <p className="text-sm text-gray-500 mb-3">{subtitle}</p>
                <div className="mb-3">
                    <h4 className="text-xs font-semibold text-gray-600 mb-1">Attributes:</h4>
                    <ul className="text-xs text-gray-700 space-y-0.5 font-mono">
                        {attributes.map((attr, i) => <li key={i}>• {attr}</li>)}
                    </ul>
                </div>
                <div>
                    <h4 className="text-xs font-semibold text-gray-600 mb-1">Methods:</h4>
                    <ul className="text-xs text-gray-700 space-y-0.5 font-mono">
                        {methods.map((method, i) => <li key={i}>• {method}</li>)}
                    </ul>
                </div>
            </div>
        );

        const PatternCard = ({ name, purpose, implementation, classes, example }) => (
            <div className="border border-gray-200 rounded-lg p-4 hover:shadow-md transition-shadow mb-4">
                <h3 className="font-bold text-lg text-gray-800 mb-2">{name}</h3>
                <div className="space-y-2 text-sm">
                    <div><span className="font-semibold text-gray-700">Účel: </span><span className="text-gray-600">{purpose}</span></div>
                    <div><span className="font-semibold text-gray-700">Implementace: </span><span className="text-gray-600">{implementation}</span></div>
                    <div>
                        <span className="font-semibold text-gray-700">Klíčové třídy: </span>
                        <div className="flex flex-wrap gap-1 mt-1">
                            {classes.map((cls, i) => <span key={i} className="bg-blue-50 text-blue-700 px-2 py-0.5 rounded text-xs font-mono">{cls}</span>)}
                        </div>
                    </div>
                    <div className="bg-gray-50 p-2 rounded mt-2">
                        <span className="font-semibold text-gray-700 text-xs">Příklad:</span>
                        <pre className="text-xs text-gray-700 mt-1 font-mono overflow-x-auto">{example}</pre>
                    </div>
                </div>
            </div>
        );

        const RequirementsTab = () => (
            <div className="space-y-6">
                <h2 className="text-2xl font-bold text-gray-800 mb-4">Systémové požadavky</h2>
                <div className="space-y-4">
                    <RequirementCard id="FR-001" title="Blockchain transakce" priority="Povinný" description="Systém musí zaznamenávat každou operaci jako transakci v blockchainu. Transakce obsahuje identifikaci strany, parametry (teplota, doba, cena, kvalita), čas a abstraktní podpis." />
                    <RequirementCard id="FR-002" title="Diskrétní simulace" priority="Povinný" description="Simulace probíhá v diskrétních taktech (1 takt = 1 hodina). V každém taktu probíhají operace sekvenčně v jednom vlákně." />
                    <RequirementCard id="FR-003" title="Event-driven komunikace" priority="Povinný" description="Entity komunikují pomocí událostí. Události lze distribuovat více entitám, které jsou na ně zaregistrovány." />
                    <RequirementCard id="FR-004" title="Poruchy a opravy zařízení" priority="Povinný" description="Stroje a roboti se opotřebovávají a mohou se porouchat. Po poruše vzniká alert, který řeší opravář podle priority a FIFO." />
                    <RequirementCard id="FR-005" title="Detekce double spending" priority="Povinný" description="Systém musí detekovat pokus o vícenásobný prodej stejného produktu pod stejným certifikátem původu." />
                    <RequirementCard id="FR-006" title="Detekce manipulace blockchainu" priority="Povinný" description="Systém rozpozná pokus o zpětnou úpravu parametrů transakcí pomocí hash validace a Merkle Tree." />
                    <RequirementCard id="FR-007" title="Supply Chain Management" priority="Povinný" description="Ředitel SCM prochází ekosystémem a provádí optimalizace. Inspektor kontroluje opotřebení zařízení. Visitor pattern." />
                    <RequirementCard id="FR-008" title="Generování reportů" priority="Povinný" description="Systém generuje 5 typů reportů: FoodChainReport, PartiesReport, FactoryConsumptionReport, SecurityReport, TransactionReport, OutagesReport." />
                    <RequirementCard id="FR-009" title="Blockchain kanály" priority="Povinný" description="Systém realizuje různé kanály pro typy produktů (čerstvé ryby, mražené produkty). Každá strana má definováno, v jakých kanálech může participovat." />
                    <RequirementCard id="FR-010" title="Spotřeba a náklady" priority="Povinný" description="Stroje a roboti mají spotřebu (elektřina, materiál), lidé mají náklady na práci. Každá linka generuje report o spotřebě." />
                    <RequirementCard id="FR-011" title="Dynamická poptávka" priority="Bonusový" description="Subjekty mohou posílat požadavky do kanálů. Ostatní účastníci reagují podle dostupnosti a ceny." />
                    <RequirementCard id="FR-012" title="Stavový automat ryby" priority="Bonusový" description="Ryba prochází stavy: ulovena → přepravena → zpracována → skladována → vařena → prodána. State pattern." />
                    <RequirementCard id="FR-013" title="Rekonstrukce stavu" priority="Bonusový" description="Zrekonstruování stavu ryby nebo zařízení v libovolném taktu na základě historie blockchainu. Memento pattern." />
                </div>
            </div>
        );

        const EntitiesTab = () => (
            <div className="space-y-6">
                <h2 className="text-2xl font-bold text-gray-800 mb-4">Hlavní entity systému</h2>
                <div className="grid md:grid-cols-2 gap-4">
                    <EntityCard title="Party" subtitle="Abstraktní účastník řetězce" 
                        attributes={['id: String', 'name: String', 'balance: Money', 'channels: List<Channel>', 'wallet: Wallet']} 
                        methods={['sendTransaction(tx)', 'receiveTransaction(tx)', 'getBalance()', 'isInChannel(channel)']} />
                    <EntityCard title="Fisherman" subtitle="extends Party" 
                        attributes={['catchCapacity: int', 'fishingArea: String']} 
                        methods={['catchFish(type, amount)', 'processTick(tick)']} />
                    <EntityCard title="Processor" subtitle="extends Party" 
                        attributes={['machines: List<Machine>', 'processingLine: ProductionLine']} 
                        methods={['processFood(food)', 'handleMachineFailure(machine)']} />
                    <EntityCard title="Warehouse" subtitle="extends Party" 
                        attributes={['storage: Map<Food,Integer>', 'temperature: double', 'capacity: int']} 
                        methods={['storeFood(food, duration)', 'retrieveFood(food)', 'checkQuality(food)']} />
                    <EntityCard title="Kitchen" subtitle="extends Party" 
                        attributes={['chefs: List<Chef>', 'robots: List<RoboticChef>', 'recipes: List<Recipe>']} 
                        methods={['cookDish(recipe, ingredients)', 'assignChef(task)']} />
                    <EntityCard title="Blockchain" subtitle="Core component" 
                        attributes={['chains: Map<Channel,List<Block>>', 'pendingTransactions: List<Transaction>']} 
                        methods={['addTransaction(tx, channel)', 'createBlock(channel)', 'validateChain(channel)', 'detectDoubleSpending(product)']} />
                    <EntityCard title="Block" subtitle="Blockchain building block" 
                        attributes={['index: int', 'timestamp: long', 'transactions: List<Transaction>', 'previousHash: String', 'merkleRoot: String', 'hash: String']} 
                        methods={['calculateHash()', 'calculateMerkleRoot()', 'validate()']} />
                    <EntityCard title="Transaction" subtitle="Blockchain transaction" 
                        attributes={['id: String', 'from: Party', 'to: Party', 'product: Product', 'operationType: OperationType', 'parameters: Map<String,Object>']} 
                        methods={['sign(party)', 'verify()', 'toHash()']} />
                    <EntityCard title="Machine" subtitle="Production equipment" 
                        attributes={['id: String', 'type: MachineType', 'wear: double', 'maxWear: double', 'isBroken: boolean', 'powerConsumption: double']} 
                        methods={['process(food)', 'increaseWear(amount)', 'breakDown()', 'repair()']} />
                    <EntityCard title="SimulationEngine" subtitle="Main controller" 
                        attributes={['currentTick: int', 'ecosystem: Ecosystem', 'eventQueue: EventQueue', 'blockchain: Blockchain']} 
                        methods={['runTick()', 'processEvents()', 'updateEntities()', 'generateReports()']} />
                </div>
            </div>
        );

        const PatternsTab = () => (
            <div className="space-y-6">
                <h2 className="text-2xl font-bold text-gray-800 mb-4">Design Patterns</h2>
                <PatternCard name="1. Factory Method" purpose="Vytváření různých typů entit" 
                    implementation="PartyFactory vytváří Fisherman, Processor, Warehouse. FoodFactory vytváří druhy ryb." 
                    classes={['PartyFactory', 'FoodFactory', 'Party', 'Food']} 
                    example="Party fisherman = PartyFactory.createFisherman('F1', 'John', area);" />
                <PatternCard name="2. Builder" purpose="Konstrukce komplexních objektů" 
                    implementation="TransactionBuilder pro postupné sestavení transakce. BlockBuilder pro vytvoření bloku." 
                    classes={['TransactionBuilder', 'BlockBuilder', 'EcosystemConfigBuilder']} 
                    example="Transaction tx = new TransactionBuilder().from(f).to(p).product(s).build();" />
                <PatternCard name="3. State" purpose="Řízení stavů ryby" 
                    implementation="Fish má aktuální stav. Každý stav definuje možné přechody." 
                    classes={['FoodState', 'CaughtState', 'TransportedState', 'ProcessedState', 'CookedState', 'SoldState']} 
                    example="fish.setState(new TransportedState()); fish.process();" />
                <PatternCard name="4. Observer" purpose="Event-driven komunikace" 
                    implementation="EventManager spravuje observery. Entity se registrují na typy událostí." 
                    classes={['EventManager', 'Event', 'EventObserver', 'AlertEvent', 'RepairmanObserver']} 
                    example="eventManager.subscribe(MACHINE_FAILURE, repairman); eventManager.publish(alert);" />
                <PatternCard name="5. Visitor" purpose="Průchod hierarchií entit" 
                    implementation="SCMDirector a Inspector procházejí Party objekty a provádějí operace." 
                    classes={['PartyVisitor', 'SCMDirector', 'Inspector', 'Party']} 
                    example="director.visit(fisherman); director.visit(processor);" />
                <PatternCard name="6. Chain of Responsibility" purpose="Zpracování oprav podle priority" 
                    implementation="Repair requests procházejí řetězcem RepairHandlerů podle priority." 
                    classes={['RepairHandler', 'HighPriorityHandler', 'MediumPriorityHandler', 'LowPriorityHandler']} 
                    example="chain.setNext(medium).setNext(low); chain.handle(request);" />
                <PatternCard name="7. Memento" purpose="Rekonstrukce stavu v minulosti" 
                    implementation="Entity vytváří memento objekty. MementoCaretaker spravuje historii." 
                    classes={['EntityMemento', 'MementoCaretaker', 'FoodMemento', 'MachineMemento']} 
                    example="memento = fish.createMemento(tick); fish.restore(memento);" />
                <PatternCard name="8. Singleton" purpose="Jediná instance Blockchain" 
                    implementation="Blockchain je singleton zajišťující globální přístup." 
                    classes={['Blockchain', 'SimulationEngine']} 
                    example="Blockchain blockchain = Blockchain.getInstance();" />
                <PatternCard name="9. Decorator" purpose="Rozšiřování funkcionality strojů" 
                    implementation="Machine může být dekorován různými vlastnostmi." 
                    classes={['Machine', 'MachineDecorator', 'AutomaticMachine', 'MonitoredMachine']} 
                    example="Machine m = new MonitoredMachine(new EfficientMachine(basic));" />
                <PatternCard name="10. Object Pool" purpose="Opětovné využití objektů" 
                    implementation="RepairmanPool a VehiclePool spravují fondy objektů." 
                    classes={['ObjectPool<T>', 'RepairmanPool', 'VehiclePool']} 
                    example="Repairman r = pool.acquire(); pool.release(r);" />
                <PatternCard name="11. Stream API" purpose="Funkcionální zpracování" 
                    implementation="Stream API pro filtrování transakcí, agregaci dat v reportech." 
                    classes={['Transaction', 'Report generators']} 
                    example="transactions.stream().filter(t -> t.getType() == SALE).collect(toList());" />
            </div>
        );

        const ArchitectureTab = () => (
            <div className="space-y-6">
                <h2 className="text-2xl font-bold text-gray-800 mb-4">Architektura systému</h2>
                <section className="border border-gray-200 rounded-lg p-6">
                    <h3 className="font-bold text-lg mb-4">Vrstvová architektura</h3>
                    <div className="space-y-3">
                        <div className="bg-blue-50 border-l-4 border-blue-500 p-4 rounded">
                            <h4 className="font-semibold mb-1">1. Simulation Layer</h4>
                            <p className="text-sm text-gray-600 mb-2">Řídí běh simulace, zpracování taktů, koordinaci entit</p>
                            <div className="flex flex-wrap gap-1">
                                {['SimulationEngine', 'TimeManager', 'TickProcessor'].map(c => 
                                    <span key={c} className="bg-white px-2 py-1 rounded text-xs border">{c}</span>)}
                            </div>
                        </div>
                        <div className="bg-blue-50 border-l-4 border-blue-500 p-4 rounded">
                            <h4 className="font-semibold mb-1">2. Business Logic Layer</h4>
                            <p className="text-sm text-gray-600 mb-2">Implementace byznyslové logiky, operace nad entitami</p>
                            <div className="flex flex-wrap gap-1">
                                {['Party', 'Food', 'Machine', 'ProductionLine', 'SCMDirector'].map(c => 
                                    <span key={c} className="bg-white px-2 py-1 rounded text-xs border">{c}</span>)}
                            </div>
                        </div>
                        <div className="bg-blue-50 border-l-4 border-blue-500 p-4 rounded">
                            <h4 className="font-semibold mb-1">3. Blockchain Layer</h4>
                            <p className="text-sm text-gray-600 mb-2">Správa blockchainu, transakcí, kanálů</p>
                            <div className="flex flex-wrap gap-1">
                                {['Blockchain', 'Block', 'Transaction', 'Channel', 'MerkleTree'].map(c => 
                                    <span key={c} className="bg-white px-2 py-1 rounded text-xs border">{c}</span>)}
                            </div>
                        </div>
                        <div className="bg-blue-50 border-l-4 border-blue-500 p-4 rounded">
                            <h4 className="font-semibold mb-1">4. Event Layer</h4>
                            <p className="text-sm text-gray-600 mb-2">Event-driven komunikace</p>
                            <div className="flex flex-wrap gap-1">
                                {['EventManager', 'Event', 'EventObserver', 'EventQueue'].map(c => 
                                    <span key={c} className="bg-white px-2 py-1 rounded text-xs border">{c}</span>)}
                            </div>
                        </div>
                        <div className="bg-blue-50 border-l-4 border-blue-500 p-4 rounded">
                            <h4 className="font-semibold mb-1">5. Reporting Layer</h4>
                            <p className="text-sm text-gray-600 mb-2">Generování reportů, agregace dat</p>
                            <div className="flex flex-wrap gap-1">
                                {['ReportGenerator', 'FoodChainReport', 'SecurityReport'].map(c => 
                                    <span key={c} className="bg-white px-2 py-1 rounded text-xs border">{c}</span>)}
                            </div>
                        </div>
                    </div>
                </section>
                <section className="border border-gray-200 rounded-lg p-6 mt-6">
                    <h3 className="font-bold text-lg mb-4">Ukázková konfigurace</h3>
                    <div className="bg-gray-50 p-4 rounded">
                        <pre className="text-xs font-mono text-gray-700 overflow-x-auto whitespace-pre-wrap">{`ecosystem:
  parties:
    - type: Fisherman
      id: F1
      name: "Captain John"
      balance: 10000
      catchCapacity: 100
      channels: [fresh_fish]
    
    - type: Processor
      id: P1
      name: "SeaFood Processing Co."
      balance: 50000
      channels: [fresh_fish, processed_fish]
      machines:
        - type: Filleting
          powerConsumption: 5.0
        - type: Cleaning
          powerConsumption: 3.0

  foodTypes:
    - Salmon
    - Tuna
    - Shrimp
    - Cod
    - Sardine

  productionLines:
    - name: "Fresh Products"
      channel: processed_fish
    - name: "Frozen Products"
      channel: processed_fish`}</pre>
                    </div>
                </section>
            </div>
        );

        const SW2Documentation = () => {
            const [activeTab, setActiveTab] = useState('requirements');
            const tabs = [
                { id: 'requirements', label: 'Funkční požadavky', icon: FileText },
                { id: 'entities', label: 'Hlavní entity', icon: Boxes },
                { id: 'patterns', label: 'Design Patterns', icon: GitBranch },
                { id: 'architecture', label: 'Architektura', icon: Settings }
            ];

            return (
                <div className="min-h-screen bg-gray-50 p-6">
                    <div className="max-w-6xl mx-auto">
                        <header className="bg-white rounded-lg shadow-sm p-6 mb-6">
                            <h1 className="text-3xl font-bold text-gray-800 mb-2">🐟 Smart Seafood Chain - SW2 Návrh</h1>
                            <p className="text-gray-600">Komplexní návrh systému pro sledování potravinového řetězce s blockchain technologií</p>
                        </header>
                        <div className="bg-white rounded-lg shadow-sm mb-6">
                            <div className="flex border-b overflow-x-auto">
                                {tabs.map(tab => {
                                    const Icon = tab.icon;
                                    return (
                                        <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                                            className={`flex items-center gap-2 px-6 py-3 font-medium transition-colors whitespace-nowrap ${
                                                activeTab === tab.id ? 'border-b-2 border-blue-500 text-blue-600' : 'text-gray-600 hover:text-gray-800'
                                            }`}>
                                            <Icon /> {tab.label}
                                        </button>
                                    );
                                })}
                            </div>
                            <div className="p-6">
                                {activeTab === 'requirements' && <RequirementsTab />}
                                {activeTab === 'entities' && <EntitiesTab />}
                                {activeTab === 'patterns' && <PatternsTab />}
                                {activeTab === 'architecture' && <ArchitectureTab />}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<SW2Documentation />, document.getElementById('root'));
    </script>
</body>
</html>
